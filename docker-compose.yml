# Zehitomo scrape — same project folder on Mac or Hostinger KVM.
#
# Terminal 1 (keep container running):
#   docker compose up --build
#
# Terminal 2 (shell inside, then run rotate / scrape):
#   docker compose exec scrape bash
#   ./scripts/run_rotate.sh
#   # or: python -m app.main alamin --service 民泊清掃 --limit 1 ...
#
# Stop: Ctrl+C in terminal 1, or: docker compose down

services:
  scrape:
    build: .
    image: zehitomo-scrape:latest
    platform: linux/amd64
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      DISPLAY: ":99"
      # VNC=1 → x11vnc on :5900 for logging in (see usages.md). Optional VNC_PASSWORD in .env.
      VNC: "${VNC:-0}"
    ports:
      # Host loopback only — reach it from your laptop via: ssh -L 5900:localhost:5900 user@vps
      - "127.0.0.1:5900:5900"
    working_dir: /app
    shm_size: "2gb"
    tty: true
    stdin_open: true
    volumes:
      - .:/app
    # Stay up so you can exec in; entrypoint still starts Xvfb first
    command: ["sleep", "infinity"]
    # command: ["python", "-m", "app.main", "--help"]

